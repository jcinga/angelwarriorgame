      if (p){ hg.translate(p[0],p[1]); hg.rotate(ang[k]); hg.translate(-p[0],-p[1]); }
      hg.drawImage(img[k], m.x, m.y, m.w, m.h); hg.restore(); }
    hg.restore();
    tint(hg, 0.30*(1-0.8*blaze), now);
    if (hitFlash > 0){ hg.save(); hg.globalCompositeOperation = "source-atop"; hg.fillStyle = `rgba(255,40,30,${hitFlash*1.6})`; hg.fillRect(0,0,W,H); hg.restore(); }
    if (blaze > 0 && state !== "over"){
      hg.save(); hg.globalCompositeOperation = "source-atop"; hg.fillStyle = `rgba(255,214,120,${0.45*blaze*(0.8+0.2*Math.sin(now*22))})`; hg.fillRect(0,0,W,H); hg.restore();
      g.save(); g.shadowColor = "rgba(255,200,90,0.95)"; g.shadowBlur = 40*blaze; g.drawImage(hero, 0, 0); g.restore();
    }
    if (now < graceUntil && state === "playing") g.globalAlpha = 0.55 + 0.45*Math.abs(Math.sin(now*28));
    if (state === "over"){ const k = Math.min(1, (now - dead)/1.4);
      if (k < 1){ g.save(); g.globalAlpha = 1 - k; g.shadowColor = "rgba(255,230,160,0.9)"; g.shadowBlur = 30 + 60*k; g.drawImage(hero, 0, 0); g.restore(); } }
    else {
      if (state === "ready" && lready){                                        // the title first: he flies in front of it
        const lw = 380, lh = lw*logo.height/logo.width, ly = 70 + 5*Math.sin(now*1.6);
        const rise = Math.min(3.5, titleBeat), inK = Math.max(0, Math.min(1, (now - titleAt - (titleBeat - rise))/rise));   // dark while the drums build, then it rises and is whole on the great hit
        g.save(); g.globalCompositeOperation = "lighter"; g.globalAlpha = (0.94 + 0.06*Math.sin(now*2.3)) * inK*inK;
        g.drawImage(logo, W/2 - lw/2, ly, lw, lh); g.restore();
      }
      g.drawImage(hero, 0, 0);
    }
    g.globalAlpha = 1;
  }
  g.save(); g.globalCompositeOperation = "lighter";
  for (const b of bursts){
    const fade = 1 - b.t/b.life, tw = b.tw ? 0.55 + 0.45*Math.sin(b.t*b.tw) : 1;
    g.globalAlpha = fade*tw; g.fillStyle = b.color; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill();
    if (b.tw){ g.globalAlpha = fade*tw*0.3; g.fillRect(b.x-b.r*1.6, b.y-0.5, b.r*3.2, 1); g.fillRect(b.x-0.5, b.y-b.r*1.6, 1, b.r*3.2); }   // a little star, not a scratch
  }
  g.restore();

  /* ---- HUD ---- */
  g.save(); g.textAlign = "center"; g.textBaseline = "top";
  if (state === "playing"){                                                    // the pause mark: two small bars in the corner
    g.globalAlpha = paused ? 0.9 : 0.35; g.fillStyle = "#F2DFA6"; g.fillRect(18, 18, 5, 18); g.fillRect(28, 18, 5, 18); g.globalAlpha = 1;
    if (paused){ g.font = "600 17px Cinzel, Georgia, serif"; g.lineWidth = 4; g.strokeStyle = "rgba(0,0,0,0.85)"; g.fillStyle = "#F2DFA6";
      g.strokeText("PAUSED", W/2, H/2 + 40); g.fillText("PAUSED", W/2, H/2 + 40); } }
  if (state !== "ready"){
    const gk = Math.max(0, 1 - (now - scoreGlow)/0.9);                          // a soul was just saved: the number swells and glows, then settles
    g.save(); g.translate(W/2, 18 + 26); g.scale(1 + 0.16*gk, 1 + 0.16*gk); g.translate(-W/2, -(18 + 26));
    g.font = "700 52px Cinzel, Georgia, serif"; g.lineWidth = 6; g.strokeStyle = "rgba(0,0,0,0.85)"; g.fillStyle = gk > 0 ? "#FFF4D0" : "#F2DFA6";
    g.strokeText(pts(), W/2, 18);
    if (gk > 0){ g.shadowColor = "rgba(255,215,120,0.95)"; g.shadowBlur = 36*gk; g.fillText(pts(), W/2, 18); g.fillText(pts(), W/2, 18); g.shadowBlur = 0; }
    g.fillText(pts(), W/2, 18); g.restore();
    g.font = "600 17px Cinzel, Georgia, serif"; g.lineWidth = 4; g.fillStyle = "#F2DFA6";
    // (the gold is set here on purpose: the number above it is drawn inside a save/restore, so after it the
    //  colour is whatever the last spark left behind — on the death and victory screens, not gold at all)
    const line = `SOULS ${saved}     DEMONS ${slain}`; g.strokeText(line, W/2, 76); g.fillText(line, W/2, 76);
    // the frame rate, kept for the next time the phone feels slow: add ?fps to the address and it shows top-left
    fpsN++; if (SHOW_FPS){ if (now - fpsAt > 0.5){ fpsShown = Math.round(fpsN/(now - fpsAt)); fpsN = 0; fpsAt = now;
        if (window.NATIVE_FPS && state === "playing" && (fpsLog++ & 3) === 0) console.log("fps " + fpsShown + (boss ? " boss:" + boss.phase : " depth:" + depth)); }   // and to the app's log, every two seconds
      g.save(); g.font = "600 12px Cinzel, Georgia, serif"; g.textAlign = "left"; g.fillStyle = "rgba(200,200,200,0.7)"; g.lineWidth = 3; g.strokeText(fpsShown + " fps", 14, 70); g.fillText(fpsShown + " fps", 14, 70); g.restore(); }
    // power: a thin bar of gold, three lights wide
    if (shown > power) shown = Math.max(power, shown - 220*dt); else if (shown < power){ shown = Math.min(power, shown + 22*dt);
      for (let i = 0; i < 2; i++) barSparks.push({ x: W/2 - 90 + 180*shown/T.power + (Math.random()-0.5)*10, y: 104 + (Math.random()-0.5)*8,
        vx: (Math.random()-0.5)*40, vy: -20 - Math.random()*50, t: 0, life: 0.5 + Math.random()*0.5, r: 1.6 + Math.random()*2.2 }); }
    if (speed > 1){ g.font = "600 11px Cinzel, Georgia, serif"; g.lineWidth = 3; g.fillStyle = "#C9B98E"; g.globalAlpha = 0.8;
      g.strokeText("FAST", W/2 + 118, 101); g.fillText("FAST", W/2 + 118, 101); g.globalAlpha = 1; }
    const bw = 180, bx = W/2 - bw/2, by = 100, pf = Math.max(0, shown)/T.power;
    g.fillStyle = "rgba(0,0,0,0.55)"; g.fillRect(bx-2, by-2, bw+4, 12);
    const pg = g.createLinearGradient(bx,0,bx+bw,0); pg.addColorStop(0,"#A87A28"); pg.addColorStop(1,"#F2DFA6");
    g.fillStyle = pf < 0.34 && Math.sin(now*12) > 0 ? "#FF6A3A" : pg; g.fillRect(bx, by, bw*pf, 8);
    // (the two pale dividers that split the bar into thirds are gone — Jerry, 2026-09-20)
    // the wound: the bar's own colour (gold, or the red it turns when he is nearly spent) drips off its receding edge — drops that fall, and specks that sit on the bar and fade (blood-red read as too much: Jerry, 2026-09-23)
    if (now < bleedUntil) for (let i = 0; i < 2; i++) barBlood.push({ x: bx + bw*pf + (Math.random()-0.5)*6, y: by + 4 + (Math.random()-0.5)*6,
      vx: (Math.random()-0.5)*90, vy: 10 + Math.random()*70, t: 0, life: 0.7 + Math.random()*0.7, r: 0.7 + Math.random()*1.0, drop: true });
    if (barBlood.length){ g.save();
      for (const b of barBlood){ b.t += dt; if (b.drop){ b.vy += 320*dt; b.x += b.vx*dt; b.y += b.vy*dt; } const f = 1 - b.t/b.life;
        g.globalAlpha = b.drop ? Math.min(1, f*1.6) : 0.85*f; g.fillStyle = pf < 0.34 ? (b.drop ? "#FF6A3A" : "#B0301A") : (b.drop ? "#F2DFA6" : "#A87A28"); g.beginPath(); g.arc(b.x, b.y, b.r*(b.drop ? 0.7 + 0.3*f : 1), 0, 7); g.fill(); }
      barBlood = barBlood.filter(b => b.t < b.life); g.restore(); }
    if (barSparks.length){ g.save(); g.globalCompositeOperation = "lighter";               // the mending: sparks off the bar's growing edge
      for (const b of barSparks){ b.t += dt; b.x += b.vx*dt; b.y += b.vy*dt; const f = 1 - b.t/b.life;
        g.globalAlpha = f*(0.6 + 0.4*Math.sin(b.t*30)); g.fillStyle = "#FFF6D0"; g.beginPath(); g.arc(b.x, b.y, b.r*(0.6+0.4*f), 0, 7); g.fill(); }
      barSparks = barSparks.filter(b => b.t < b.life); g.restore(); }

  }
  if (false && boss && (boss.phase === "fight" || boss.phase === "dying") && state === "playing"){   // the Amalgam's life bar — hidden (Jerry read it as his own); flip `false` to show it
    const bw = 300, bx = W/2 - bw/2, by = 96, f = Math.max(0, boss.hp/T.bossHP);
    g.save(); g.fillStyle = "rgba(0,0,0,0.6)"; g.fillRect(bx-2, by-2, bw+4, 10);
    g.fillStyle = "#B8281E"; g.fillRect(bx, by, bw*f, 6);
    g.strokeStyle = "rgba(242,223,166,0.45)"; g.lineWidth = 1; g.strokeRect(bx-0.5, by-0.5, bw+1, 7); g.restore(); }
  if (state === "won"){
    const k = Math.max(0, Math.min(1, (now - wonAt)/1.2));
    g.save(); g.textAlign = "center"; g.globalAlpha = k;
    g.lineWidth = 5; g.strokeStyle = "rgba(0,0,0,0.9)"; g.fillStyle = "#F2DFA6";
    g.font = "italic 600 34px 'Cormorant Garamond', Georgia, serif"; g.lineWidth = 6;
    const vw = Math.max(...verse.lines.map(l => g.measureText(l).width)), vs = Math.min(34, 34*450/vw);   // a long line shrinks the whole verse to fit
    g.font = `italic 600 ${vs.toFixed(1)}px 'Cormorant Garamond', Georgia, serif`;
    let vy = H*0.40 + 146;                                                       // a different verse greets each victory (VERSES)
    for (const line of verse.lines){ g.strokeText(line, W/2, vy); g.fillText(line, W/2, vy); vy += vs*1.18; }
    vy += 12; g.font = "600 17px Cinzel, Georgia, serif"; g.fillStyle = "#C9B58A"; g.lineWidth = 4;
    g.strokeText(verse.ref, W/2, vy); g.fillText(verse.ref, W/2, vy);
    if (now - wonAt > 2.5){ g.globalAlpha = Math.min(1, (now - wonAt - 2.5)/0.5) * (0.75 + 0.25*Math.sin(now*3)); g.fillStyle = "#F2DFA6";
      g.font = "600 22px Cinzel, Georgia, serif"; g.lineWidth = 6; g.strokeText("PLAY AGAIN", W/2, vy + 44); g.fillText("PLAY AGAIN", W/2, vy + 44); }
    g.restore(); }
  if (state === "ready"){
    const wordsK = Math.max(0, Math.min(1, (now - titleAt - titleBeat)/0.8)); g.save(); g.globalAlpha = wordsK;   // the words follow the drum
    if (lready && !RELEASE){                                                  // Level  1  2  3 — tap a numeral to begin there (not in the shipped app)
      const n = T.levelAt.length, lab = "Level";
      g.font = "italic 24px 'Cormorant Garamond', Georgia, serif"; g.lineWidth = 4; g.textAlign = "left";
      const lw2 = g.measureText(lab).width, total = lw2 + 14 + (n-1)*PICK.gap + 20;
      const sx = W/2 - total/2;
      g.fillStyle = "#E8DCC4"; g.strokeText(lab, sx, PICK.y); g.fillText(lab, sx, PICK.y);
      PICK.x0 = sx + lw2 + 24;
      g.textAlign = "center"; g.font = "600 24px Cinzel, Georgia, serif";
      for (let i=0;i<n;i++){ const x = PICK.x0 + i*PICK.gap, on = i === jump && !jumpPre;
        g.fillStyle = on ? "#F2DFA6" : "#6E6478"; g.globalAlpha = on ? 1 : 0.85;
        g.strokeText(i+1, x, PICK.y); g.fillText(i+1, x, PICK.y);
        if (on){ g.globalAlpha = 0.55; g.strokeStyle = "#E8B44C"; g.lineWidth = 1;
          g.beginPath(); g.moveTo(x-13, PICK.y + 30); g.lineTo(x+13, PICK.y + 30); g.stroke();
          g.lineWidth = 4; g.strokeStyle = "rgba(0,0,0,0.85)"; }
        g.globalAlpha = 1; }
      // and between them, smaller: 1.8, 2.8 ... — start just short of a change, to watch the world turn over (testing)
      g.font = "italic 15px 'Cormorant Garamond', Georgia, serif"; g.lineWidth = 3;
      for (let i=0;i<n-1;i++){ const x = PICK.x0 + (i+0.5)*PICK.gap, on = jumpPre && i === jump;
        g.fillStyle = on ? "#F2DFA6" : "#5A5264"; g.globalAlpha = on ? 1 : 0.8;
        const lab2 = (i+1) + (i === n-2 ? ".5" : ".8"); g.strokeText(lab2, x, PICK.y + 44); g.fillText(lab2, x, PICK.y + 44);
        if (i === n-2){ const xb = PICK.x0 + 5.5*PICK.gap, onb = jumpBoss; g.fillStyle = onb ? "#F2DFA6" : "#5A5264"; g.globalAlpha = onb ? 1 : 0.8; g.strokeText("B", xb, PICK.y + 44); g.fillText("B", xb, PICK.y + 44); }
        if (on){ g.globalAlpha = 0.55; g.strokeStyle = "#E8B44C"; g.lineWidth = 1;
          g.beginPath(); g.moveTo(x-11, PICK.y + 64); g.lineTo(x+11, PICK.y + 64); g.stroke();
          g.lineWidth = 3; g.strokeStyle = "rgba(0,0,0,0.85)"; }
        g.globalAlpha = 1; }
      g.textAlign = "center"; }
    // NORMAL | FAST — tap one to begin; the one he used last is lit
    g.font = "600 20px Cinzel, Georgia, serif"; g.lineWidth = 4;
    const canGo = assetsReady() ? 1 : 0.4;                                        // still loading: the two words wait, dim
    for (const [lab, dx, on] of [["NORMAL", -SPD.dx, speed === 1], ["FAST", SPD.dx, speed > 1]]){
      const x = W/2 + dx; g.fillStyle = on ? "#F2DFA6" : "#8A8194"; g.globalAlpha = (on ? 1 : 0.9)*canGo;
      g.strokeText(lab, x, SPD.y); g.fillText(lab, x, SPD.y);
      g.globalAlpha = 1; }                                                     // (no underline, no divider between them — Jerry, 2026-09-27)
    g.font = "700 21px Cinzel, Georgia, serif"; g.lineWidth = 5; g.fillStyle = "#F2DFA6";
    g.strokeText("KILL DEMONS", W/2, TAG_Y); g.fillText("KILL DEMONS", W/2, TAG_Y);
    g.strokeText("SAVE SOULS",  W/2, TAG_Y + 26); g.fillText("SAVE SOULS",  W/2, TAG_Y + 26);
    g.font = "600 15px Cinzel, Georgia, serif"; g.lineWidth = 4;
    const bl = (best ? "best  " + best : "") + (best && bestFast ? "     " : "") + (bestFast ? "fast  " + bestFast : "");
    if (bl) { g.strokeText(bl, W/2, TAG_Y + 50); g.fillText(bl, W/2, TAG_Y + 50); }

    if (jump){ g.font = "600 12px Cinzel, Georgia, serif"; g.fillStyle = "#8A8194";
      g.strokeText("no best is kept below level 1", W/2, 752); g.fillText("no best is kept below level 1", W/2, 752); }
    // (no "gathering" words for players — Jerry; while the pictures are still coming in, NORMAL | FAST simply sit dim, below)
    g.globalAlpha = wordsK*0.75; g.font = "600 11px Cinzel, Georgia, serif"; g.fillStyle = "#C9B98E"; g.lineWidth = 3;   // the corner: sound
    g.strokeText(muted ? "SOUND OFF" : "SOUND ON", W - 40, 24); g.fillText(muted ? "SOUND OFF" : "SOUND ON", W - 40, 24);
    g.restore();
  }
  if (state === "ready"){ const rise = Math.min(3.5, titleBeat), veil = 1 - Math.max(0, Math.min(1, (now - titleAt - (titleBeat - rise))/rise));
    if (veil > 0){ g.fillStyle = `rgba(0,0,0,${veil})`; g.fillRect(0, 0, W, H); } }   // dark while the drums build; the fire, the angel and the title come up together
  if (state === "gate"){                                                       // the black before: one tap lets the sound in
    g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
    if (gateAt < 0) gateAt = now;
    const gIn = Math.min(1, (now - gateAt)/1.4), gFade = gIn*gIn*(3 - 2*gIn);   // fades up from black over 1.4 s
    g.font = "600 21.6px Cinzel, Georgia, serif"; g.lineWidth = 4; g.strokeStyle = "rgba(0,0,0,0.9)"; g.fillStyle = "#C9B58A";
    g.globalAlpha = gFade*(0.72 + 0.28*Math.sin(now*2.2)); g.strokeText("TAP TO ENTER", W/2, H/2 - 10); g.fillText("TAP TO ENTER", W/2, H/2 - 10); g.globalAlpha = 1;   // it breathes, it never goes out
  }
  if (state === "demo"){                                                   // the demo's end card
    const k = Math.min(1, (now - demoAt)/1.2);
    g.save(); g.textAlign = "center"; g.fillStyle = `rgba(0,0,0,${0.55*k})`; g.fillRect(0,0,W,H); g.globalAlpha = k;
    g.lineWidth = 6; g.strokeStyle = "rgba(0,0,0,0.9)"; g.fillStyle = "#F2DFA6"; g.font = "italic 600 34px 'Cormorant Garamond', Georgia, serif";
    g.strokeText("The demo ends here", W/2, 420); g.fillText("The demo ends here", W/2, 420);
    g.font = "600 16px Cinzel, Georgia, serif"; g.fillStyle = "#C9B58A"; g.lineWidth = 4;
    for (const [t, y] of [["FOUR MORE REALMS", 462], ["AND THE FINAL DEMON AWAIT", 486]]){ g.strokeText(t, W/2, y); g.fillText(t, W/2, y); }
    if (DEMO_STORE){ const bx = W/2 - DEMO_BTN.w/2, by = DEMO_BTN.y - DEMO_BTN.h/2;
      g.fillStyle = "#E8B44C"; g.beginPath(); if (g.roundRect) g.roundRect(bx, by, DEMO_BTN.w, DEMO_BTN.h, 10); else g.rect(bx, by, DEMO_BTN.w, DEMO_BTN.h); g.fill();
      g.fillStyle = "#1A1208"; g.font = "700 19px Cinzel, Georgia, serif"; g.fillText(DEMO_LABEL, W/2, DEMO_BTN.y + 7);
      g.fillStyle = "#C9B58A"; g.font = "600 14px Cinzel, Georgia, serif"; g.strokeText(DEMO_SUB, W/2, DEMO_BTN.y + 52); g.fillText(DEMO_SUB, W/2, DEMO_BTN.y + 52); }
    else { g.fillStyle = "#F2DFA6"; g.font = "600 18px Cinzel, Georgia, serif";
      for (const [t, y] of [["COMING TO THE APP STORE", 556], ["NOVEMBER 1", 582]]){ g.strokeText(t, W/2, y); g.fillText(t, W/2, y); } }
    if (now - demoAt > 2.5){ g.globalAlpha = Math.min(1, (now - demoAt - 2.5)/0.5) * (0.75 + 0.25*Math.sin(now*3)); g.fillStyle = "#F2DFA6"; g.font = "600 20px Cinzel, Georgia, serif";
      g.strokeText("PLAY AGAIN", W/2, 690); g.fillText("PLAY AGAIN", W/2, 690); }
    g.restore();
  }
  if (state === "over"){
    const k = Math.max(0, Math.min(1, (now - dead - 1.0)/0.7));
    g.fillStyle = `rgba(0,0,0,${0.45*k})`; g.fillRect(0,0,W,H);
    if (now - dead > 1.8){
      g.globalAlpha = Math.min(1, (now - dead - 1.8)/0.5) * (0.75 + 0.25*Math.sin(now*3));
      g.font = "600 26px Cinzel, Georgia, serif"; g.lineWidth = 6; g.strokeStyle = "rgba(0,0,0,0.9)"; g.fillStyle = "#F2DFA6";
      g.strokeText("PLAY AGAIN", W/2, H/2 - 14); g.fillText("PLAY AGAIN", W/2, H/2 - 14);
    }
  }
  g.restore();
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
</script>
